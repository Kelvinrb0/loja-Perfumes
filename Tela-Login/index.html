<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yas Perfumes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand">
                <h1>Yas Perfumes</h1>
                <p id="subtitle">Acesse sua conta</p>
            </div>
            
            <form id="login-form" class="form-active">
                <div class="input-group">
                    <label for="email-login">E-mail</label>
                    <input type="email" id="email-login" required>
                </div>
                <div class="input-group">
                    <label for="password-login">Senha</label>
                    <input type="password" id="password-login" required>
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>

            <form id="register-form" class="form-hidden">
                <div class="input-group">
                    <label for="name-register">Nome</label>
                    <input type="text" id="name-register" required>
                </div>
                <div class="input-group">
                    <label for="email-register">E-mail</label>
                    <input type="email" id="email-register" required>
                </div>
                <div class="input-group">
                    <label for="password-register">Senha</label>
                    <input type="password" id="password-register" required>
                </div>
                <button type="submit" class="btn">Cadastrar</button>
            </form>

            <div class="toggle-container">
                Não tem uma conta? <button id="toggle-btn" type="button">Criar conta</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
